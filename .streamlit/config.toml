[theme]
base = "dark"
primaryColor = "#147D70"
backgroundColor = "#0D1015"
secondaryBackgroundColor = "#1B2029"
textColor = "#EDF1F5"
borderColor = "#29313D"
baseRadius = "10px"
buttonRadius = "8px"
font = "sans-serif"
codeFont = "monospace"
baseFontSize = 15
headingFontSizes = ["32px", "24px", "20px", "17px", "15px", "13px"]
headingFontWeights = [600, 600, 600, 500, 500, 500]
linkColor = "#66CBB8"
showWidgetBorder = true
showSidebarBorder = true
chartCategoricalColors = ["#66CBB8", "#A6AFBD", "#6BD9A0", "#F4C16B", "#FF8893"]
greenColor = "#6BD9A0"
orangeColor = "#F4C16B"
redColor = "#FF8893"
dataframeHeaderBackgroundColor = "#1B2029"
dataframeHeaderTextColor = "#EDF1F5"

[theme.sidebar]
backgroundColor = "#141820"
secondaryBackgroundColor = "#1B2029"

[server]
headless = true
maxUploadSize = 10

[browser]
gatherUsageStats = false
